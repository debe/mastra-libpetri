name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    # 20 until M6; the corpus gate's fast lane (ADR 0009) adds minutes of proofs to `npm test`.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # The solver is a test input, so its version is pinned and verified on PATH. Without it
      # every proof returns `unknown` and the suite would still report green.
      - uses: ./.github/actions/install-z3

      # libpetri comes from the registry at the version the lockfile pins, so CI tests exactly
      # what a release consumer gets rather than whatever libpetri's main branch holds today.
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The M6 gate's slow lane (ADR 0009): the corpus workflows whose proofs take minutes each — every
  # one with a `.foreach()`, and the widest `.parallel()` — at both budgets. The fast lane
  # of the same gate runs inside `npm test` above; together they are every corpus workflow.
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: ./.github/actions/install-z3

      - run: npm ci
      - run: npx vitest run tests/verify/corpus.test.ts
        env:
          SLOW_PROOFS: '1'
          CORPUS_SHARD: ${{ matrix.shard }}/6
