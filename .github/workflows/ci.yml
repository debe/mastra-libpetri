name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    # 20 until M6; the corpus gate (ADR 0009) adds about 13 minutes of proofs to `npm test` on ten
    # cores — every workflow, 30 s a query, no slow lane.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # The solver is a test input, so its version is pinned and verified on PATH. Without it
      # every proof returns `unknown` and the suite would still report green.
      - uses: ./.github/actions/install-z3

      # libpetri comes from the registry at the version the lockfile pins, so CI tests exactly
      # what a release consumer gets rather than whatever libpetri's main branch holds today.
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

