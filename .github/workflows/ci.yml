name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    # Everything but the corpus gate, which the `corpus` job shards.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # The solver is a test input, so its version is pinned and verified on PATH. Without it
      # every proof returns `unknown` and the suite would still report green.
      - uses: ./.github/actions/install-z3

      # libpetri comes from the registry at the version the lockfile pins, so CI tests exactly
      # what a release consumer gets rather than whatever libpetri's main branch holds today.
      - run: npm ci
      - run: npm run check
      - run: npm test -- --exclude tests/verify/corpus.test.ts
      - run: npm run build

  corpus:
    # The corpus gate (ADR 0009): about 13 minutes of proofs on ten cores, far longer on one
    # runner, so the workflows are split across shards (`CORPUS_SHARD`, tests/verify/corpus.test.ts).
    # Same claims, same 30 s a query in every shard — a slow proof is a net to redesign.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: ./.github/actions/install-z3

      - run: npm ci
      - run: npx vitest run tests/verify/corpus.test.ts
        env:
          CORPUS_SHARD: ${{ matrix.shard }}/8
          PROOF_LOG: proof-log.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-log-${{ matrix.shard }}
          path: typescript/proof-log.txt
          if-no-files-found: ignore
